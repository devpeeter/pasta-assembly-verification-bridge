name: Unit and integrity checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-integrity-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  unit-integrity:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes and initialize artifact context
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifactRoot = Join-Path $env:RUNNER_TEMP "pasta-unit-integrity"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          [ordered]@{
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA
            event = $env:GITHUB_EVENT_NAME
            image = $env:ImageOS
            image_version = $env:ImageVersion
          } | ConvertTo-Json | Set-Content (Join-Path $artifactRoot "context.json") -Encoding utf8

      - name: Check out source in the documented layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: outputs/pasta-assembly-verification-bridge
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          architecture: x64

      - name: Run all Python, source-integrity and freshness checks
        working-directory: outputs/pasta-assembly-verification-bridge
        run: |
          python scripts/ci_unit.py --output "$env:RUNNER_TEMP/pasta-unit-integrity/checks"
          exit $LASTEXITCODE

      - name: Upload complete unit and integrity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pasta-unit-integrity/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
