name: Full verification

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  full-verification:
    runs-on: windows-2025
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes and initialize artifact context
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifactRoot = Join-Path $env:RUNNER_TEMP "pasta-full-verification"
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          [ordered]@{
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA
            event = $env:GITHUB_EVENT_NAME
            image = $env:ImageOS
            image_version = $env:ImageVersion
          } | ConvertTo-Json | Set-Content (Join-Path $artifactRoot "context.json") -Encoding utf8

      - name: Check out source in the documented layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: outputs/pasta-assembly-verification-bridge
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          architecture: x64

      - name: Check original sources, tests and generated files
        working-directory: outputs/pasta-assembly-verification-bridge
        run: |
          python scripts/ci_unit.py --output "$env:RUNNER_TEMP/pasta-full-verification/unit"
          exit $LASTEXITCODE

      - name: Bootstrap pinned tools and run complete clean verification
        working-directory: outputs/pasta-assembly-verification-bridge
        run: |
          python scripts/ci_full.py --output "$env:RUNNER_TEMP/pasta-full-verification/full"
          exit $LASTEXITCODE

      - name: Upload complete logs, provenance, audits and measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pasta-full-verification/
            !${{ runner.temp }}/pasta-full-verification/**/workspace/work/**
            !${{ runner.temp }}/pasta-full-verification/**/.lake/**
            !${{ runner.temp }}/pasta-full-verification/**/__pycache__/**
            !${{ runner.temp }}/pasta-full-verification/**/*.olean
            !${{ runner.temp }}/pasta-full-verification/**/*.ilean
            !${{ runner.temp }}/pasta-full-verification/**/*.pyc
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
